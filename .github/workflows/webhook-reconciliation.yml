name: Webhook reconciliation cron

# Vercel Hobby only allows daily-or-less cron schedules, and this job needs to run every
# 30 minutes (it reconciles Anchor payment webhooks and retries failed account
# provisioning), so it's triggered from here instead of vercel.json.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  call-reconciliation-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/webhook-reconciliation
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://usefacilit8.training/api/cron/webhook-reconciliation"
